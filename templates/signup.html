<!DOCTYPE html>
<html>
<head>
    <title>Student Signup</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );
        }

        .signup-container{

            width:350px;

            padding:40px;

            border-radius:20px;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(10px);

            box-shadow:0px 8px 30px rgba(0,0,0,0.2);

            text-align:center;

            color:white;
        }

        h1{
            margin-bottom:25px;
        }

        input{

            width:100%;

            padding:12px;

            margin:12px 0;

            border:none;

            border-radius:10px;

            outline:none;

            font-size:16px;
        }

        button{

            width:100%;

            padding:12px;

            margin-top:15px;

            border:none;

            border-radius:10px;

            background:#0f172a;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#1e293b;
            transform:scale(1.03);
        }

        a{
            display:block;
            margin-top:20px;
            color:white;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="signup-container">

    <h1>✨ Create Account</h1>

    <form method="POST">

        <input type="text"
        name="username"
        placeholder="Enter Username"
        required>

        <input type="password"
        name="password"
        placeholder="Enter Password"
        required>

        <button type="submit">
            Signup
        </button>

    </form>

    <a href="/">
        Already have account? Login
    </a>

</div>

</body>
</html>
